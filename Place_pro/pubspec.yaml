name: placepro
description: A placement app for SAEC students.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  fl_chart: ^0.68.0
  flutter_svg: ^2.0.10
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.0
  table_calendar: ^3.1.3
  
  # Utils
  intl: ^0.19.0
  http: ^1.2.0
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  file_picker: ^6.2.1
  open_filex: ^4.3.4
  flutter_local_notifications: ^16.3.3
  hijri: ^3.0.0
  flutter_multi_formatter: ^2.13.10
  
  # PDF Generation
  pdf: ^3.10.6
  printing: ^5.11.1
  
  # Analytics
  firebase_analytics: ^10.10.2
  
  # Error Reporting
  firebase_crashlytics: ^3.2.5
  
  # Performance Monitoring
  firebase_performance: ^0.9.3+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  
  # Code Generation
  build_runner: ^2.4.7
  
  # Code Analysis
  very_good_analysis: ^5.1.0
  
  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4
  test: ^1.24.8
  
  # Code Coverage
  test_cov_console: ^0.2.2
  
  # Performance Testing
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon_web.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon_windows.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/companies/
    - assets/icons/
    - assets/data/
    - assets/fonts/