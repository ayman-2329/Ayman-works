# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:very_good_analysis/analysis_options_5.0.0.yaml

analyzer:
  # Enable stricter analysis options
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false
  errors:
    # Treat missing required parameters as errors
    missing_required_param: error
    # Treat missing returns as errors
    missing_return: error
    # Treat todo comments as warnings
    todo: warning
    # Treat unused code as warnings
    unused_import: warning
    unused_local_variable: warning
    unused_element: warning
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.mocks.dart'
    - '**/generated_plugin_registrant.dart'
    - '**/test/**'
    - '**/integration_test/**'

linter:
  rules:
    # Style
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_final_locals: true
    prefer_final_fields: true
    prefer_const_declarations: true
    prefer_conditional_assignment: true
    prefer_const_literals_to_create_immutables: true
    prefer_relative_imports: true
    prefer_null_aware_operators: true
    prefer_collection_literals: true
    prefer_typing_uninitialized_variables: true
    prefer_void_to_null: true
    
    # Documentation
    public_member_api_docs: false
    always_put_required_named_parameters_first: true
    always_put_control_body_on_new_line: true
    always_specify_types: true
    annotate_overrides: true
    avoid_annotating_with_dynamic: true
    avoid_empty_else: true
    avoid_equals_and_hash_code_on_mutable_classes: true
    avoid_function_literals_in_foreach_calls: true
    avoid_implementing_value_types: true
    avoid_init_to_null: true
    avoid_null_checks_in_equality_operators: true
    avoid_relative_lib_imports: true
    avoid_return_types_on_setters: true
    avoid_returning_null_for_void: true
    avoid_shadowing_type_parameters: true
    avoid_single_cascade_in_expression_statements: true
    avoid_unused_constructor_parameters: true
    await_only_futures: true
    camel_case_types: true
    cancel_subscriptions: true
    cascade_invocations: true
    comment_references: true
    constant_identifier_names: true
    control_flow_in_finally: true
    curly_braces_in_flow_control_structures: true
    depend_on_referenced_packages: true
    deprecated_consistency: true
    empty_catches: true
    empty_constructor_bodies: true
    empty_statements: true
    file_names: true
    implementation_imports: true
    invariant_booleans: true
    iterable_contains_unrelated_type: true
    library_names: true
    library_prefixes: true
    list_remove_unrelated_type: true
    no_duplicate_case_values: true
    no_leading_underscores_for_local_identifiers: true
    no_logic_in_create_state: true
    non_constant_identifier_names: true
    null_closures: true
    omit_local_variable_types: true
    only_throw_errors: true
    overridden_fields: true
    package_api_docs: true
    package_names: true
    package_prefixed_library_names: true
    prefer_adjacent_string_concatenation: true
    prefer_asserts_in_initializer_lists: true
    prefer_asserts_with_message: true
    prefer_const_constructors_in_immutables: true
    prefer_constructors_over_static_methods: true
    prefer_contains: true
    prefer_double_quotes: false
    prefer_equal_for_default_values: true
    prefer_expression_function_bodies: true
    prefer_final_in_for_each: true
    prefer_initializing_formals: true
    prefer_interpolation_to_compose_strings: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    prefer_is_not_operator: true
    prefer_iterable_whereType: true
    prefer_mixin: true
    prefer_null_aware_method_calls: true
    prefer_single_quotes: true
    prefer_spread_collections: true
    prefer_typing_uninitialized_variables: true
    prefer_void_to_null: true
    provide_deprecation_message: true
    public_member_api_docs: false
    recursive_getters: true
    require_trailing_commas: true
    slash_for_doc_comments: true
    sort_child_properties_last: true
    sort_constructors_first: true
    sort_pub_dependencies: true
    sort_unnamed_constructors_first: true
    test_types_in_equals: true
    throw_in_finally: true
    type_annotate_public_apis: true
    type_init_formals: true
    unawaited_futures: true
    unnecessary_brace_in_string_interps: true
    unnecessary_const: true
    unnecessary_getters_setters: true
    unnecessary_lambdas: true
    unnecessary_new: true
    unnecessary_null_aware_assignments: true
    unnecessary_null_in_if_null_operators: true
    unnecessary_overrides: true
    unnecessary_parenthesis: true
    unnecessary_raw_strings: true
    unnecessary_statements: true
    unnecessary_this: true
    unnecessary_to_list_in_spreads: true
    use_build_context_synchronously: true
    use_function_type_syntax_for_parameters: true
    use_key_in_widget_constructors: true
    use_rethrow_when_possible: true
    use_setters_to_change_properties: true
    use_string_buffers: true
    valid_regexps: true
    void_checks: true
    
    # Disabled rules
    avoid_print: false  # Allowed for debugging
    avoid_unused_constructor_parameters: false  # False positives in Flutter
    avoid_renaming_method_parameters: false  # False positives in Flutter
    avoid_positional_boolean_parameters: false  # Not always applicable
    avoid_private_typedef_functions: false  # Sometimes needed for callbacks
    avoid_classes_with_only_static_members: false  # Sometimes needed for constants
    avoid_escaping_inner_quotes: false  # Sometimes more readable to escape
    avoid_field_initializers_in_const_classes: false  # Not always applicable
    avoid_function_literals_in_foreach_calls: false  # Sometimes more readable
    avoid_returning_null: false  # Sometimes null is a valid return value
    avoid_returning_null_for_void: false  # Sometimes needed for callbacks
    avoid_unnecessary_containers: false  # Sometimes needed for performance
    avoid_void_async: false  # Sometimes needed for callbacks
    camel_case_extensions: false  # Not always applicable
    cascade_invocations: false  # Sometimes makes code less readable
    constant_identifier_names: false  # Not always applicable
    depend_on_referenced_packages: false  # Not always applicable
    lines_longer_than_80_chars: false  # Sometimes needed for URLs, etc.
    missing_whitespace_between_adjacent_strings: false  # Sometimes intentional
    no_default_cases: false  # Sometimes default is not needed
    non_constant_identifier_names: false  # Not always applicable
    omit_local_variable_types: false  # Explicit types improve readability
    parameter_assignments: false  # Sometimes needed in builders
    prefer_relative_imports: false  # Not always applicable
    prefer_single_quotes: false  # Sometimes double quotes are better for JSON
    prefer_typing_uninitialized_variables: false  # Not always applicable
    public_member_api_docs: false  # Too verbose for internal code
    require_trailing_commas: false  # Sometimes makes diffs cleaner
    sort_constructors_first: false  # Sometimes logical grouping is better
    sort_pub_dependencies: false  # Sometimes logical grouping is better
    type_annotate_public_apis: false  # Not always needed for public APIs
    unnecessary_const: false  # Sometimes improves performance
    unnecessary_new: false  # Sometimes improves readability
    unnecessary_null_in_if_null_operators: false  # Sometimes more readable
    unnecessary_this: false  # Sometimes improves readability
    use_build_context_synchronously: false  # Too many false positives

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
